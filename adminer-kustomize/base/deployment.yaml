apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer-kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adminer-kustomize
  template:
    metadata:
      labels:
        app: adminer-kustomize
    spec:
      containers:
        - name: adminer
          image: adminer:latest
          ports:
            - containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres-sts
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi