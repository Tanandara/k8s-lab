apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-sts
  namespace: eks-lab

spec:
  serviceName: postgres-sts
  replicas: 1

  selector:
    matchLabels:
      app: postgres-sts

  template:
    metadata:
      labels:
        app: postgres-sts

    spec:
      containers:
        - name: postgres
          image: postgres:17

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: postgres-secret

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - labdb
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - labdb
            initialDelaySeconds: 15
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi



