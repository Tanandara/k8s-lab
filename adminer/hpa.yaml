apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adminer
  namespace: eks-lab

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adminer

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50