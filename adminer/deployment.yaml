apiVersion: apps/v1
kind: Deployment

metadata:
  name: adminer
  namespace: eks-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: adminer

  template:
    metadata:
      labels:
        app: adminer

    spec:
      containers:
        - name: adminer
          image: adminer:latest

          ports:
            - containerPort: 8080

          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 9999
          #   initialDelaySeconds: 5
          #   periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 9999
          #   initialDelaySeconds: 15
          #   periodSeconds: 10