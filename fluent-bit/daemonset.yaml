apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging

spec:
  selector:
    matchLabels:
      app: fluent-bit

  template:
    metadata:
      labels:
        app: fluent-bit

    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:latest

          volumeMounts:
            - name: varlog
              mountPath: /var/log

            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf

      volumes:
        - name: varlog
          hostPath:
            path: /var/log

        - name: config
          configMap:
            name: fluent-bit-config
















